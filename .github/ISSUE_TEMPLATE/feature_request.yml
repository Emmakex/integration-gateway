name: Feature request
description: Propose a provider-neutral improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the integration problem using fictional examples.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Capability boundary
      options:
        - Inbound webhooks
        - Outbound REST
        - SOAP/XML
        - Background jobs and replay
        - Persistence and observability
        - Documentation and CI
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the reusable behavior and extension points.
    validations:
      required: true
  - type: textarea
    id: reliability
    attributes:
      label: Reliability and security impact
      description: Note trust boundaries, retries, idempotency or deployment implications.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The proposal can be demonstrated with fictional data.
          required: true
