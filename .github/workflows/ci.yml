name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Public safety check
        run: npm run check:safety

      - name: Release consistency
        run: npm run check:release

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: HTTP smoke suite
        env:
          HOST: 127.0.0.1
          PORT: 3001
          LOG_LEVEL: warn
          SMOKE_BASE_URL: http://127.0.0.1:3001
          WEBHOOK_SIGNING_SECRET: integration-gateway-ci-demo-key
          WEBHOOK_MAX_AGE_SECONDS: 300
          EXPOSE_AUDIT_API: true
          OUTBOUND_BASE_URL: http://127.0.0.1:3001
          OUTBOUND_TIMEOUT_MS: 1000
          OUTBOUND_MAX_ATTEMPTS: 3
          OUTBOUND_RETRY_BASE_DELAY_MS: 1
          OUTBOUND_RETRY_MAX_DELAY_MS: 5
          SOAP_ENDPOINT: http://127.0.0.1:3001/v1/demo-soap-target
          SOAP_TIMEOUT_MS: 1000
          SOAP_MAX_RESPONSE_BYTES: 65536
          JOB_WORKER_ENABLED: false
          JOB_POLL_INTERVAL_MS: 50
          JOB_DEFAULT_MAX_ATTEMPTS: 3
          JOB_RETRY_BASE_DELAY_MS: 1
          JOB_RETRY_MAX_DELAY_MS: 2
          ENABLE_DEMO_API: true
          ENABLE_DEMO_TARGET: true
        run: |
          npm start > /tmp/integration-gateway.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          npm run smoke

      - name: Dependency audit
        run: npm audit --audit-level=high
